# Release builds for anyship. CI runs `goreleaser release --snapshot` on every
# pull request; pushing a vX.Y.Z tag publishes a GitHub release.
version: 2
project_name: anyship

builds:
  - id: anyship
    main: ./cmd/anyship
    binary: anyship
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Same commit, same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: anyship
    # No version in the name, so install.sh can use releases/latest/download.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # The binary also carries the schema (anyship schema), but shipping the
      # file means an editor can point at it straight out of the archive.
      - src: schema/anyship.schema.json
        dst: anyship.schema.json

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^.*?(docs|test|ci|chore|style)(\(.+\))??!?:.+$'

release:
  # Tags like v1.0.0-rc.1 become pre-releases.
  prerelease: auto
