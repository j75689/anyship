# yaml-language-server: $schema=https://raw.githubusercontent.com/j75689/anyship/main/schema/anyship.schema.json
apiVersion: anyship/v1alpha1
kind: App
metadata:
  name: shop
spec:
  services:
    api:
      kind: server
      path: api
      dockerfile: api/Dockerfile
      start: ./server
      ports:
        - name: http
          port: 8080
          protocol: http
          exposure: public
        - name: metrics
          port: 9090
          exposure: internal
      replicas: 2
      env:
        LOG_LEVEL: info
      secrets:
        - STRIPE_KEY
        - SESSION_SECRET
      uses:
        - db
        - cache
      runtime:
        language: go
        edgeCompatible: false
      healthCheck:
        path: /healthz
    mailer:
      kind: worker
      path: worker
      start: ./worker
      secrets:
        - SESSION_SECRET
      uses:
        - cache
      cron:
        - schedule: '*/5 * * * *'
          command: ./worker flush
      dependsOn:
        - api
    site:
      kind: static
      path: web
      build:
        command: npm run build
        output: dist
  resources:
    cache:
      type: redis
      external: true
    db:
      type: postgres
  secrets:
    SESSION_SECRET:
      generate: hex32
    STRIPE_KEY:
      description: Stripe secret key
