# yaml-language-server: $schema=https://raw.githubusercontent.com/j75689/anyship/main/schema/anyship.schema.json
apiVersion: anyship/v1alpha1
kind: App
metadata:
  name: eth-mainnet
spec:
  services:
    lighthouse:
      kind: server
      image: sigp/lighthouse:latest
      start: lighthouse bn --network mainnet --datadir /data --execution-endpoint http://reth:8551 --execution-jwt /run/secrets/JWT_SECRET
      ports:
        - name: p2p
          port: 9000
          protocol: tcp+udp
          exposure: public
        - name: api
          port: 5052
          protocol: http
          exposure: internal
      volumes:
        - name: lighthouse-data
          mountPath: /data
          size: 200GB
          class: nvme
      secrets:
        - JWT_SECRET
      dependsOn:
        - reth
    reth:
      kind: server
      image: ghcr.io/paradigmxyz/reth:latest
      start: reth node --chain mainnet --datadir /data --http --http.addr 0.0.0.0 --authrpc.jwtsecret /run/secrets/JWT_SECRET
      ports:
        - name: p2p
          port: 30303
          protocol: tcp+udp
          exposure: public
        - name: rpc
          port: 8545
          protocol: http
          exposure: internal
        - name: engine
          port: 8551
          protocol: http
          exposure: internal
      volumes:
        - name: reth-data
          mountPath: /data
          size: 2TB
          class: nvme
      secrets:
        - JWT_SECRET
  secrets:
    JWT_SECRET:
      generate: hex32
      description: Engine API secret shared by the execution and consensus clients
  targets:
    gcp:
      project: my-project
      region: asia-northeast1
    vps:
      host: deploy@203.0.113.10
      dir: /srv/eth-mainnet
