name: Bug report
description: Something anyship did wrong, or refused to do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Don't file it here; see [SECURITY.md](https://github.com/j75689/anyship/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `anyship --version`
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - cloudflare
        - vps
        - gcp
        - aws
        - not target-specific
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and CPU
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64, Windows 11 amd64
  - type: textarea
    id: spec
    attributes:
      label: anyship.yaml
      description: The spec, or the smallest one that shows the problem. Remove hosts, ids and secret values you don't want public.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command and its full output. `plan --json` helps for plan problems.
      render: console
