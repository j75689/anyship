name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check below needs main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # setup-go's cache holds what the first job to finish after a go.sum
      # change compiled, with go test's flags, for linux/amd64. dist.sh builds
      # with -trimpath for six platforms, so none of that is reused: every run
      # compiled the stdlib and every dependency six times, 35s per platform.
      # The CI run on main after a merge saves this entry; a tag can read it.
      - name: Build cache for the release platforms
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: dist-go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: dist-go-build-${{ runner.os }}-
      - name: Release only what is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Fails before anything is built if CHANGELOG.md has no dated section
      # for this tag.
      - name: Release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Test before publishing
        run: make test
      - name: Build the archives
        run: make dist VERSION="$GITHUB_REF_NAME"
      # Tags like v1.0.0-rc.1 become pre-releases.
      - name: Publish the release
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
