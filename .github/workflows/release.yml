name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check below needs main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Release only what is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Fails before anything is built if CHANGELOG.md has no dated section
      # for this tag.
      - name: Release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Test before publishing
        run: make test
      - name: Build the archives
        run: make dist VERSION="$GITHUB_REF_NAME"
      # Tags like v1.0.0-rc.1 become pre-releases.
      - name: Publish the release
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
