name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The lint, test and build jobs run Makefile targets, so `make check` on a
# laptop checks the same things.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make tidy-check
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  # Releases ship Windows binaries, so the unit tests must pass on Windows,
  # where the path separator is a backslash. The docker and ssh end-to-end
  # tests stay on Linux; they skip themselves here.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Builds the binary and runs it, then compiles every package for the other
  # two operating systems a release ships. release-snapshot builds all six
  # platforms; this job is the quick answer to "does it build".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: ./anyship --version && ./anyship targets
      - run: make build-all PLATFORMS="darwin/arm64 windows/amd64"

  # Builds and runs an image for every app under dockerfile/testdata/apps:
  # detect → generate Dockerfile → docker build → docker run → HTTP 200.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-images

  # Builds every release archive without publishing, then installs from them
  # with install.sh, the way users will, including a tampered archive.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make dist
      # The release workflow publishes these as the release notes; a section
      # the script can't read should fail here, not after a tag is pushed.
      - name: Release notes can be read from CHANGELOG.md
        run: |
          latest=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          ALLOW_UNRELEASED=1 scripts/release-notes.sh "$latest"
      - name: List the archives
        run: ls -l dist/*.tar.gz dist/*.zip dist/checksums.txt
      - name: Install from the snapshot with install.sh
        run: |
          python3 -m http.server 8765 --directory dist >/dev/null 2>&1 &
          sleep 1
          ANYSHIP_DOWNLOAD_BASE=http://127.0.0.1:8765 ANYSHIP_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/anyship" --version | tee version.txt
          grep -q -- '-next' version.txt
          "$RUNNER_TEMP/bin/anyship" targets
      - name: Refuse a tampered archive
        run: |
          mkdir tampered && cp dist/checksums.txt dist/anyship_linux_amd64.tar.gz tampered/
          echo tampered >> tampered/anyship_linux_amd64.tar.gz
          python3 -m http.server 8766 --directory tampered >/dev/null 2>&1 &
          sleep 1
          if ANYSHIP_DOWNLOAD_BASE=http://127.0.0.1:8766 ANYSHIP_INSTALL_DIR="$RUNNER_TEMP/bin2" sh install.sh; then
            echo "install.sh accepted a tampered archive" && exit 1
          fi
          test ! -e "$RUNNER_TEMP/bin2/anyship"

  # Deploys a sample app to the runner itself over ssh, exercising the vps
  # target on a real Linux host with Docker: preflight, apply, status, logs
  # and destroy.
  vps-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Make the runner reachable as localhost over ssh
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo systemctl start ssh
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost 'docker version --format "docker {{.Server.Version}}"'
      - run: make e2e-vps

  # Deploys a sample app to a kind cluster on the runner, with a registry the
  # nodes pull from, exercising the kubernetes target end to end: preflight,
  # apply, status, logs, prune and destroy.
  kubernetes-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The registry answers as kind-registry:5001 on the runner (/etc/hosts)
      # and on the nodes (containerd hosts.toml), so images are pushed to and
      # pulled from that name.
      - name: Start a kind cluster with a local registry
        id: kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: anyship
          registry: true
          registry_port: 5001
      - run: make e2e-kubernetes
        env:
          ANYSHIP_K8S_REPOSITORY: ${{ steps.kind.outputs.LOCAL_REGISTRY }}/anyship-e2e
