name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  # Builds and runs an image for every app under dockerfile/testdata/apps:
  # detect → generate Dockerfile → docker build → docker run → HTTP 200.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./dockerfile -run TestGeneratedImagesServeHTTP -v -timeout 30m
        env:
          ANYSHIP_DOCKER_TESTS: "1"

  # Deploys a sample app to the runner itself over ssh, exercising the vps
  # target on a real Linux host with Docker: preflight, apply, status, logs
  # and destroy.
  vps-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Make the runner reachable as localhost over ssh
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo systemctl start ssh
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost 'docker version --format "docker {{.Server.Version}}"'
      - run: go build -o anyship ./cmd/anyship
      - run: ANYSHIP=./anyship scripts/e2e-vps.sh
