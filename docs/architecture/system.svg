<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" role="img" aria-label="anyship system map. Callers use the CLI or the MCP server. Core packages and an adapter contract drive five adapters: cloudflare, vps, gcp, aws and kubernetes. Each adapter talks to its provider directly below it, where all deployment state lives. Locally anyship reads anyship.yaml and only writes generated files to .anyship.">
  <style>
    svg { --bg:#f4f6f8; --panel:#ffffff; --fg:#15202b; --muted:#556270; --line:#c3ccd5; --accent:#b8430f; --accent-soft:#fbe7dc; color:var(--fg); }
    @media (prefers-color-scheme: dark) { svg { --bg:#0f151b; --panel:#161e27; --fg:#e2e8ee; --muted:#94a2b0; --line:#344250; --accent:#f08a4b; --accent-soft:#3a2418; } }
    .bg { fill:var(--bg); }
    .n { fill:var(--panel); stroke:var(--line); stroke-width:1.25; }
    .n-strong { fill:var(--panel); stroke:var(--fg); stroke-width:1.25; }
    .n-state { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
    .frame { fill:none; stroke:var(--fg); stroke-width:1.25; }
    .group { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 4; }
    .state { fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:6 5; }
    .t { fill:var(--fg); font:600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill:var(--muted); font:11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .m { fill:var(--muted); font:11px ui-monospace, Menlo, monospace; }
    .lbl { fill:var(--fg); font:500 11px ui-monospace, Menlo, monospace; }
    .accent-lbl { fill:var(--accent); font:600 11px ui-monospace, Menlo, monospace; letter-spacing:.04em; }
    .a { stroke:currentColor; stroke-width:1.4; fill:none; }
    .a-accent { stroke:var(--accent); stroke-width:1.6; fill:none; }
    .head { fill:currentColor; }
    .head-accent { fill:var(--accent); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1080" height="880"/>

  <!-- callers -->
  <rect class="n" x="290" y="20" width="240" height="56" rx="6"/>
  <text class="t" x="410" y="44" text-anchor="middle">You · CI</text>
  <text class="s" x="410" y="63" text-anchor="middle">terminal and scripts</text>
  <rect class="n" x="550" y="20" width="240" height="56" rx="6"/>
  <text class="t" x="670" y="44" text-anchor="middle">AI agent</text>
  <text class="s" x="670" y="63" text-anchor="middle">Claude Code, Cursor, …</text>
  <line class="a" x1="410" y1="76" x2="410" y2="143" marker-end="url(#arr)"/>
  <text class="lbl" x="418" y="114">commands</text>
  <line class="a" x1="670" y1="76" x2="670" y2="143" marker-end="url(#arr)"/>
  <text class="lbl" x="678" y="114">MCP over stdio</text>

  <!-- the binary -->
  <rect class="frame" x="200" y="100" width="680" height="560" rx="10"/>
  <text class="t" x="214" y="121">anyship</text>
  <text class="s" x="214" y="135">one Go binary</text>

  <rect class="n-strong" x="290" y="145" width="240" height="56" rx="6"/>
  <text class="t" x="410" y="168" text-anchor="middle">CLI</text>
  <text class="s" x="410" y="187" text-anchor="middle">init · plan · apply · diagnose …</text>
  <rect class="n-strong" x="550" y="145" width="240" height="56" rx="6"/>
  <text class="t" x="670" y="168" text-anchor="middle">MCP server</text>
  <text class="s" x="670" y="187" text-anchor="middle">deploys need --allow-deploy</text>
  <line class="a" x1="410" y1="201" x2="410" y2="233" marker-end="url(#arr)"/>
  <line class="a" x1="670" y1="201" x2="670" y2="233" marker-end="url(#arr)"/>

  <rect class="group" x="260" y="235" width="560" height="82" rx="6"/>
  <text class="m" x="270" y="251">core</text>
  <rect class="n" x="270" y="258" width="100" height="48" rx="5"/>
  <text class="t" x="320" y="278" text-anchor="middle">detect</text>
  <text class="s" x="320" y="295" text-anchor="middle">draft the spec</text>
  <rect class="n" x="380" y="258" width="100" height="48" rx="5"/>
  <text class="t" x="430" y="278" text-anchor="middle">spec</text>
  <text class="s" x="430" y="295" text-anchor="middle">schema, validate</text>
  <rect class="n" x="490" y="258" width="100" height="48" rx="5"/>
  <text class="t" x="540" y="278" text-anchor="middle">dockerfile</text>
  <text class="s" x="540" y="295" text-anchor="middle">generate</text>
  <rect class="n" x="600" y="258" width="100" height="48" rx="5"/>
  <text class="t" x="650" y="278" text-anchor="middle">image</text>
  <text class="s" x="650" y="295" text-anchor="middle">build + push</text>
  <rect class="n" x="710" y="258" width="100" height="48" rx="5"/>
  <text class="t" x="760" y="278" text-anchor="middle">diagnose</text>
  <text class="s" x="760" y="295" text-anchor="middle">collect, redact</text>
  <line class="a" x1="540" y1="317" x2="540" y2="343" marker-end="url(#arr)"/>

  <rect class="n-strong" x="210" y="345" width="660" height="48" rx="6"/>
  <text class="t" x="540" y="366" text-anchor="middle">adapter contract</text>
  <text class="m" x="540" y="383" text-anchor="middle">Plan · Apply · Logs · Status · Destroy</text>
  <line class="a" x1="268" y1="393" x2="268" y2="435" marker-end="url(#arr)"/>
  <line class="a" x1="404" y1="393" x2="404" y2="435" marker-end="url(#arr)"/>
  <line class="a" x1="540" y1="393" x2="540" y2="435" marker-end="url(#arr)"/>
  <line class="a" x1="676" y1="393" x2="676" y2="435" marker-end="url(#arr)"/>
  <line class="a" x1="812" y1="393" x2="812" y2="435" marker-end="url(#arr)"/>

  <rect class="n" x="210" y="437" width="116" height="56" rx="6"/>
  <text class="t" x="268" y="460" text-anchor="middle">cloudflare</text>
  <text class="s" x="268" y="479" text-anchor="middle">wrangler.jsonc</text>
  <rect class="n" x="346" y="437" width="116" height="56" rx="6"/>
  <text class="t" x="404" y="460" text-anchor="middle">vps</text>
  <text class="s" x="404" y="479" text-anchor="middle">compose.yaml</text>
  <rect class="n" x="482" y="437" width="116" height="56" rx="6"/>
  <text class="t" x="540" y="460" text-anchor="middle">gcp</text>
  <text class="s" x="540" y="479" text-anchor="middle">Cloud Run service</text>
  <rect class="n" x="618" y="437" width="116" height="56" rx="6"/>
  <text class="t" x="676" y="460" text-anchor="middle">aws</text>
  <text class="s" x="676" y="479" text-anchor="middle">ECS Express service</text>
  <rect class="n" x="754" y="437" width="116" height="56" rx="6"/>
  <text class="t" x="812" y="460" text-anchor="middle">kubernetes</text>
  <text class="s" x="812" y="479" text-anchor="middle">manifests.yaml</text>

  <!-- outbound calls: each adapter talks to the provider below it -->
  <line class="a-accent" x1="268" y1="493" x2="268" y2="723" marker-end="url(#arr-accent)"/>
  <text class="lbl" x="276" y="600">wrangler</text>
  <line class="a-accent" x1="404" y1="493" x2="404" y2="723" marker-end="url(#arr-accent)"/>
  <text class="lbl" x="412" y="600">ssh</text>
  <line class="a-accent" x1="540" y1="493" x2="540" y2="723" marker-end="url(#arr-accent)"/>
  <text class="lbl" x="548" y="592">gcloud</text>
  <text class="lbl" x="548" y="607">docker push</text>
  <line class="a-accent" x1="676" y1="493" x2="676" y2="723" marker-end="url(#arr-accent)"/>
  <text class="lbl" x="684" y="592">aws CLI</text>
  <text class="lbl" x="684" y="607">docker push</text>
  <line class="a-accent" x1="812" y1="493" x2="812" y2="723" marker-end="url(#arr-accent)"/>
  <text class="lbl" x="820" y="592">kubectl</text>
  <text class="lbl" x="820" y="607">docker push</text>

  <!-- local files -->
  <rect class="n-strong" x="20" y="360" width="160" height="56" rx="6"/>
  <text class="t" x="100" y="383" text-anchor="middle">anyship.yaml</text>
  <text class="s" x="100" y="402" text-anchor="middle">the only input, committed</text>
  <rect class="n" x="20" y="450" width="160" height="56" rx="6"/>
  <text class="t" x="100" y="473" text-anchor="middle">.anyship/&lt;target&gt;/</text>
  <text class="s" x="100" y="492" text-anchor="middle">generated, never read back</text>
  <line class="a" x1="180" y1="388" x2="198" y2="388" marker-end="url(#arr)"/>
  <text class="lbl" x="190" y="376" text-anchor="middle">reads</text>
  <line class="a" x1="200" y1="478" x2="182" y2="478" marker-end="url(#arr)"/>
  <text class="lbl" x="190" y="466" text-anchor="middle">writes</text>

  <!-- providers: where all deployment state lives -->
  <text class="accent-lbl" x="204" y="866">ALL DEPLOYMENT STATE LIVES ON THE PROVIDERS</text>
  <rect class="state" x="204" y="702" width="672" height="144" rx="10"/>
  <rect class="n-state" x="210" y="725" width="116" height="104" rx="6"/>
  <text class="t" x="268" y="750" text-anchor="middle">Cloudflare</text>
  <text class="s" x="268" y="770" text-anchor="middle">Workers</text>
  <text class="s" x="268" y="786" text-anchor="middle">D1 · KV · R2</text>
  <rect class="n-state" x="346" y="725" width="116" height="104" rx="6"/>
  <text class="t" x="404" y="750" text-anchor="middle">Linux host</text>
  <text class="s" x="404" y="770" text-anchor="middle">Docker Compose</text>
  <text class="s" x="404" y="786" text-anchor="middle">volumes, secrets</text>
  <rect class="n-state" x="482" y="725" width="116" height="104" rx="6"/>
  <text class="t" x="540" y="750" text-anchor="middle">Google Cloud</text>
  <text class="s" x="540" y="770" text-anchor="middle">Cloud Run</text>
  <text class="s" x="540" y="786" text-anchor="middle">Artifact Registry</text>
  <text class="s" x="540" y="802" text-anchor="middle">Secret Manager</text>
  <rect class="n-state" x="618" y="725" width="116" height="104" rx="6"/>
  <text class="t" x="676" y="750" text-anchor="middle">AWS</text>
  <text class="s" x="676" y="770" text-anchor="middle">ECS Express Mode</text>
  <text class="s" x="676" y="786" text-anchor="middle">ECR</text>
  <text class="s" x="676" y="802" text-anchor="middle">Secrets Manager</text>
  <rect class="n-state" x="754" y="725" width="116" height="104" rx="6"/>
  <text class="t" x="812" y="750" text-anchor="middle">Kubernetes</text>
  <text class="s" x="812" y="770" text-anchor="middle">any cluster, kubectl</text>
  <text class="s" x="812" y="786" text-anchor="middle">Deployments, PVCs</text>
  <text class="s" x="812" y="802" text-anchor="middle">Ingress, CronJobs</text>

</svg>
